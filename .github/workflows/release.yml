name: Release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - name: Attest main.js
        uses: actions/attest@v4
        with:
          subject-path: dist/xingyu-note-atlas/main.js
      - name: Attest styles.css
        uses: actions/attest@v4
        with:
          subject-path: dist/xingyu-note-atlas/styles.css
      - name: Verify tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = "$(node -p 'require("./manifest.json").version')"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/xingyu-note-atlas/main.js dist/xingyu-note-atlas/manifest.json dist/xingyu-note-atlas/styles.css
